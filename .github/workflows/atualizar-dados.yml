# Robô que baixa os dados do IBGE e atualiza o painel.
# Roda quando você clica em "Run workflow" (aba Actions do GitHub)
# e também sozinho todo dia 1º de cada mês.

name: Atualizar dados do IBGE

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"

env:
  PYTHONUNBUFFERED: "1"   # mostra as mensagens do Python na hora, não só no final

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar as bibliotecas
        run: pip install -r requirements.txt

      - name: Etapa 1 — baixar dados do IBGE
        run: python -u src/etapa1_baixar_dados.py

      - name: Etapa 2 — preparar dados para o painel
        run: python -u src/etapa2_preparar_dados.py

      - name: Salvar o resultado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/raiox.json
          git diff --staged --quiet || git commit -m "Atualiza dados do IBGE"
          git push
